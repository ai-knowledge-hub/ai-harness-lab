<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Practical engineering for building, operating, and evaluating AI products. Explore five tracks, reusable guides, and worked examples."
    />
    <meta name="theme-color" content="#000000" />
    <title>Harness · AI Knowledge Hub</title>
    <!--page-metadata-->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      try {
        var harnessTheme = localStorage.getItem("harness-theme");
        if (harnessTheme === "light" || harnessTheme === "dark")
          document.documentElement.dataset.theme = harnessTheme;
      } catch (error) {
        /* Use the default reading theme when storage is unavailable. */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
