name: PR Checks

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    # Playwright 1.59 supports Ubuntu 24.04; ubuntu-latest also selects 26.04.
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.7.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check TypeScript
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test:run

      - name: Build app
        run: pnpm build

      - name: Compare independent route and download baseline
        run: node scripts/check-astro-output.mjs

      - name: Verify one-record authoring and draft eligibility
        run: node scripts/check-astro-authoring.mjs

      - name: Install test browsers
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Verify Astro pilot behaviour
        run: pnpm exec playwright test --config playwright.pilot.config.js

      - name: Verify retained browser behaviour
        run: pnpm test:e2e

      - name: Verify search, accessibility and island boundaries
        run: pnpm exec playwright test --config playwright.site.config.js

      - name: Verify retained production renderer
        run: pnpm build:legacy && pnpm exec playwright test --config playwright.legacy.config.js
