name: PR Checks

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      # Keep this version aligned with @playwright/test in package.json.
      # Browsers and OS libraries are already installed; no per-run apt mirror.
      image: mcr.microsoft.com/playwright:v1.59.1-noble
      options: --ipc=host

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.7.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check TypeScript
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test:run

      # This also restores the normal production build after the temporary guide.
      - name: Verify guide authoring and build app
        run: node scripts/check-astro-authoring.mjs

      - name: Compare independent route and download baseline
        run: node scripts/check-astro-output.mjs

      - name: Verify Astro pilot behaviour
        run: pnpm exec playwright test --config playwright.pilot.config.js

      - name: Verify retained browser behaviour
        run: pnpm test:e2e

      - name: Verify search, accessibility and island boundaries
        run: pnpm exec playwright test --config playwright.site.config.js
