name: PR Checks

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    # Playwright 1.59 supports Ubuntu 24.04; ubuntu-latest also selects 26.04.
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.7.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check TypeScript
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test:run

      - name: Build app
        run: pnpm build

      - name: Setup Node for the Astro pilot
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build combined Astro pilot
        run: pnpm build:astro-pilot

      - name: Install pilot test browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify Astro pilot behaviour
        run: pnpm exec playwright test --config playwright.pilot.config.js

      - name: Run existing browser suite against combined preview
        run: pnpm exec playwright test --config playwright.staged.config.js
