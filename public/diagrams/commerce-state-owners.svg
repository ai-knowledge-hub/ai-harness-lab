<svg xmlns="http://www.w3.org/2000/svg" width="840" height="760" viewBox="0 0 840 760" role="img" aria-labelledby="title desc">
<title id="title">Who owns the state?</title><desc id="desc">Responsibility map: business information, advertising and purchase flows are separate. Merchant order records and payment-provider records require reconciliation.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0L9 4.5L0 9" fill="#3b4447"/></marker><marker id="warning" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#a7441e"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#20282b}.heading{font-size:23px;font-weight:700}.label{font-size:12px;font-weight:700;letter-spacing:1.2px}.title{font-size:19px;font-weight:700}.body{font-size:16px}.note{font-size:14px;fill:#455155}.line{fill:none;stroke:#3b4447;stroke-width:1.6;marker-end:url(#arrow)}.lost{fill:none;stroke:#a7441e;stroke-width:2;stroke-dasharray:6 5}</style>
