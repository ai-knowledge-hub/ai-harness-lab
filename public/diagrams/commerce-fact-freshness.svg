<svg xmlns="http://www.w3.org/2000/svg" width="840" height="430" viewBox="0 0 840 430" role="img" aria-labelledby="title desc">
<title id="title">A copied promise and a live offer</title><desc id="desc">An earlier feed snapshot and customer answer say 24 December. Live checkout offers 28 December. The shopper approves new terms and submission validates and reserves them. This is a proposed quote contract.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0L9 4.5L0 9" fill="#3b4447"/></marker><marker id="warning" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#a7441e"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#20282b}.heading{font-size:23px;font-weight:700}.label{font-size:12px;font-weight:700;letter-spacing:1.2px}.title{font-size:19px;font-weight:700}.body{font-size:16px}.note{font-size:14px;fill:#455155}.line{fill:none;stroke:#3b4447;stroke-width:1.6;marker-end:url(#arrow)}.lost{fill:none;stroke:#a7441e;stroke-width:2;stroke-dasharray:6 5}</style>
<rect width="840" height="430" fill="#f5f3ed"/>
<text x="24" y="40" class="heading">A copied promise and a live offer have different lifetimes</text>
<text x="24" y="80" class="label">DISCOVERY COPY · EARLIER INFORMATION MAY REMAIN VISIBLE</text>
<rect x="24" y="100" width="300" height="100" fill="#ffffff" stroke="#657175"/>
<text x="40" y="131" class="title">Earlier feed snapshot</text>
<text x="40" y="158" class="body">Delivery: 24 December</text>
<rect x="516" y="100" width="300" height="100" fill="#ffffff" stroke="#657175"/>
<text x="532" y="131" class="title">Customer-facing answer</text>
<text x="532" y="158" class="body">Delivery: 24 December</text>
<path d="M324 150H512" class="line"/>
<text x="420" y="135" class="note" text-anchor="middle">update can lag</text>
<text x="24" y="246" class="label">LIVE PURCHASE · OUR PROPOSED MERCHANT CONTRACT</text>
<rect x="24" y="270" width="240" height="100" fill="#ffffff" stroke="#657175"/>
<text x="40" y="301" class="title">Current quote q18</text>
<text x="40" y="328" class="body">Delivery: 28 December</text>
<rect x="300" y="270" width="240" height="100" fill="#ffffff" stroke="#657175"/>
<text x="316" y="301" class="title">Shopper reapproves</text>
<text x="316" y="328" class="body">The revised commitment</text>
<rect x="576" y="270" width="240" height="100" fill="#ffffff" stroke="#657175"/>
<text x="592" y="301" class="title">Submit checks quote</text>
<text x="592" y="328" class="body">Reserve or reject</text>
<path d="M264 320H296" class="line"/>
<path d="M540 320H572" class="line"/>
<text x="24" y="408" class="note">An accepted feed update is not an inventory or delivery reservation.</text>
</svg>
